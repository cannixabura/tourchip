<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b1f">
<title>領隊名片 · TourChip</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/img/icon.png">
<link rel="apple-touch-icon" href="/img/icon.png">
<style>
:root{color-scheme:dark;--bg:#070b1f;--line:rgba(196,170,255,.38);--ink:#f3f0ff;--muted:#b9b6d6;--faint:#8c89b0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:start center;background:radial-gradient(circle at 50% 18%,#241a55,var(--bg) 60%);color:var(--ink);font:400 16px/1.7 "Noto Sans TC","PingFang TC",system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.card{width:100%;max-width:460px;background:rgba(26,31,74,.72);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center}
.kicker{color:var(--faint);font-size:13px;margin:0}
h1{font-size:28px;margin:4px 0 2px;word-break:break-word}
.intro{color:var(--muted);margin:4px 0 0;word-break:break-word}
.flowers{font-size:44px;font-weight:700;margin:18px 0 0}
.flowers small{display:block;font-size:13px;font-weight:400;color:var(--faint)}
ul{list-style:none;padding:0;margin:20px 0 0;text-align:left}
li{background:rgba(255,255,255,.05);border:1px solid rgba(196,170,255,.18);border-radius:16px;padding:12px 14px;margin-bottom:10px}
li p{margin:0;word-break:break-word}
li span{display:block;color:var(--faint);font-size:12px;margin-top:4px}
.empty,.missing{color:var(--muted);margin-top:18px}
a.btn{display:block;margin-top:20px;padding:14px;border-radius:999px;text-decoration:none;color:#fff;font-weight:600;background:linear-gradient(90deg,#8e2de2,#2a63d4)}
footer{margin-top:18px;font-size:12px;color:var(--faint)}footer a{color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card" data-title="l_title">
  <p class="kicker" data-t="l_kicker">旅行團 TourChip · 領隊名片</p>
  <div id="card" hidden>
    <h1 id="name"></h1>
    <p class="intro" id="intro"></p>
    <p class="flowers">🌸 <span id="flowers">0</span><small data-t="l_flowers">團員送的花</small></p>
    <ul id="thanks"></ul>
    <p class="empty" id="empty" data-t="l_empty" hidden>領隊還沒有公開感謝。</p>
  </div>
  <p class="missing" id="missing" data-t="l_missing" hidden>找不到這張名片，或領隊已經關閉公開。</p>
  <a class="btn" href="/" data-t="l_more">認識旅行團 App</a>
</main>
<script src="/i18n.js"></script>
<script>
// 領隊自己打開的公開名片：只顯示領隊挑選公開的感謝，不顯示送的人
(function () {
  var m = location.pathname.match(/\/l\/([a-hj-np-z2-9]{10})/);
  var missing = function () { document.getElementById('missing').hidden = false; };
  if (!m) return missing();
  fetch('https://asia-southeast1-mood-whisper-f7de9.cloudfunctions.net/tourGroup', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'card', slug: m[1] })
  }).then(function (r) { return r.json(); }).then(function (r) {
    if (!r || !r.success || !r.card) return missing();
    var c = r.card;
    document.getElementById('name').textContent = c.name || '🚩';
    document.getElementById('intro').textContent = c.intro || '';
    document.getElementById('flowers').textContent = String(c.flowers || 0);
    var ul = document.getElementById('thanks');
    (c.thanks || []).forEach(function (t) {
      var li = document.createElement('li');
      var p = document.createElement('p'); p.textContent = '🌸 ' + t.text;
      var s = document.createElement('span');
      var d = new Date(t.at);
      s.textContent = (t.group ? t.group + ' · ' : '') + d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
      li.appendChild(p); li.appendChild(s); ul.appendChild(li);
    });
    if (!(c.thanks || []).length) document.getElementById('empty').hidden = false;
    document.getElementById('card').hidden = false;
  }).catch(missing);
})();
</script>
</body>
</html>
